# Template di riferimento — la config attiva è generata da Tabloza
# (scripts/configure-rtpmidid.sh → rtpmidid_config.py da config.json).
# Vedi midi.rtp_midi_timestamps_enabled nel pannello web.

[general]
alsa_name=rtpmidid
control=/var/run/rtpmidid/control.sock
use_rtp_midi_timestamps=true
playout_buffer_ms=0

[rtpmidi_announce]
name=tabloza-me
port=5004

[rtpmidi_discover]
enabled=false
