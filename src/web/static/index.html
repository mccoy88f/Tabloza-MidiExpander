<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tabloza MidiExpander</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <!-- Login -->
    <div id="login-screen" class="screen">
      <div class="lang-switcher">
        <button type="button" class="lang-btn" data-lang="it" id="lang-it-login">IT</button>
        <button type="button" class="lang-btn" data-lang="en" id="lang-en-login">EN</button>
      </div>
      <div class="card login-card">
        <h1 data-i18n="appTitle">Tabloza MidiExpander</h1>
        <p class="subtitle" data-i18n="loginSubtitle">Pannello di controllo</p>
        <form id="login-form">
          <input type="password" id="login-password" data-i18n-placeholder="password" placeholder="Password" autocomplete="current-password" required>
          <button type="submit" class="btn btn-primary" data-i18n="login">Accedi</button>
        </form>
        <p id="login-error" class="error hidden"></p>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="screen hidden">
      <header class="header">
        <h1>Tabloza</h1>
        <div class="header-actions">
          <div class="lang-switcher lang-switcher-inline">
            <button type="button" class="lang-btn" data-lang="it">IT</button>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
          </div>
          <button id="btn-logout" class="btn btn-small" data-i18n="logout">Esci</button>
        </div>
      </header>

      <!-- Status -->
      <section class="card" id="status-section">
        <h2 data-i18n="sectionStatus">Stato</h2>
        <div class="status-grid">
          <div><span class="label" data-i18n="labelAddress">Indirizzo</span><span id="status-hostname">—</span></div>
          <div><span class="label" data-i18n="labelIp">IP</span><span id="status-ip">—</span></div>
          <div><span class="label" data-i18n="labelNetwork">Rete</span><span id="status-network">—</span></div>
          <div><span class="label" data-i18n="labelActiveSf2">SF2 attivo</span><span id="status-sf2">—</span></div>
        </div>
        <div class="activity-meters">
          <div class="activity-meter" id="meter-synth">
            <span class="activity-dot" id="dot-synth"></span>
            <div>
              <span class="label" data-i18n="labelSynthEngine">Synth</span>
              <span class="activity-value" id="value-synth">—</span>
            </div>
          </div>
          <div class="activity-meter" id="meter-sf2">
            <span class="activity-dot" id="dot-sf2"></span>
            <div>
              <span class="label" data-i18n="labelSf2Loaded">SF2</span>
              <span class="activity-value" id="value-sf2">—</span>
            </div>
          </div>
          <div class="activity-meter" id="meter-midi-in">
            <span class="activity-dot" id="dot-midi-in"></span>
            <div>
              <span class="label" data-i18n="labelMidiIn">MIDI in</span>
              <span class="activity-value" id="value-midi-in">—</span>
            </div>
          </div>
          <div class="activity-meter" id="meter-audio-out">
            <span class="activity-dot" id="dot-audio-out"></span>
            <div>
              <span class="label" data-i18n="labelAudioOut">Audio out</span>
              <span class="activity-value" id="value-audio-out">—</span>
            </div>
          </div>
        </div>
        <div class="midi-status">
          <span class="label" data-i18n="labelMidiInputs">Ingressi MIDI</span>
          <ul id="midi-inputs-list" class="midi-list"></ul>
        </div>
        <div class="midi-actions">
          <button id="btn-audio-test" class="btn btn-secondary" data-i18n="audioTest">Test suono</button>
          <button id="btn-jack-test" class="btn btn-secondary" data-i18n="jackTest">Test jack</button>
          <button id="btn-midi-reset" class="btn btn-secondary" data-i18n="midiReset">MIDI Reset</button>
          <p id="audio-test-msg" class="msg hidden"></p>
          <p id="midi-reset-msg" class="msg hidden"></p>
        </div>
      </section>

      <!-- Volume -->
      <section class="card">
        <h2 data-i18n="sectionVolume">Volume Master</h2>
        <input type="range" id="volume-slider" min="0" max="127" value="100">
        <span id="volume-value">100</span>
      </section>

      <!-- SoundFonts -->
      <section class="card">
        <h2 data-i18n="sectionSoundfonts">Libreria SoundFont</h2>
        <div id="sf2-list" class="sf2-list"></div>
        <div class="upload-zone" id="upload-zone">
          <p data-i18n="uploadDrag">Trascina un file .sf2 qui</p>
          <input type="file" id="sf2-upload" accept=".sf2" hidden>
          <button type="button" class="btn btn-secondary" id="btn-choose-file" data-i18n="chooseFile">Scegli file</button>
          <div id="upload-progress" class="progress hidden">
            <div class="progress-bar" id="upload-progress-bar"></div>
          </div>
          <p id="upload-status" class="upload-status hidden"></p>
        </div>
      </section>

      <!-- WiFi -->
      <section class="card">
        <h2 data-i18n="sectionWifi">WiFi</h2>
        <button id="btn-wifi-scan" class="btn btn-secondary" data-i18n="scanNetworks">Scansiona reti</button>
        <p id="wifi-msg" class="msg hidden"></p>
        <div id="wifi-list" class="wifi-list"></div>
      </section>

      <!-- Security -->
      <section class="card">
        <h2 data-i18n="sectionSecurity">Sicurezza</h2>
        <form id="change-password-form">
          <input type="password" id="current-password" data-i18n-placeholder="currentPassword" placeholder="Password attuale" required>
          <input type="password" id="new-password" data-i18n-placeholder="newPassword" placeholder="Nuova password" required>
          <button type="submit" class="btn btn-secondary" data-i18n="changePassword">Cambia password</button>
        </form>
        <p id="password-msg" class="msg hidden"></p>
      </section>
    </div>
  </div>

  <footer class="app-footer">
    <span id="footer-version">v—</span>
    <span class="footer-sep">·</span>
    <a id="footer-github" href="https://github.com/mccoy88f/Tabloza-MidiExpander" target="_blank" rel="noopener noreferrer" data-i18n="footerCredits">mccoy88f</a>
  </footer>

  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
